services:
  postgres:
    image: postgres:16-alpine
    container_name: helapay_api_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount init.sh to run custom initialization script
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/db-init.sh
      - ./db/schema.sql:/docker-entrypoint-initdb.d/db/schema.sql

      # seed (populate) wallets table on db initialization
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: helapay_api
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "${PORT}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SERVER_PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: